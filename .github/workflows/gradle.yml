name: Java CI with Gradle

on:
  push:
    branches:
      - main
      - '*.x'  # Maintenance branches like 1.x, 2.x
    tags:
      - 'v*.*.*'
      - 'v*.*.*-RC*'  # Release candidates
      - 'v*.*.*-M*'   # Milestones
  pull_request:
    branches: [ "main", "*.x" ]

permissions:
  contents: write  # Needed for creating releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Code Style
        run: ./gradlew spotlessCheck

      - name: Build and Test
        run: ./gradlew clean check

  publish:
    needs: build
    if: |
      github.event_name == 'push' && 
      (startsWith(github.ref, 'refs/tags/v') || 
       contains(github.ref, '-RC') || 
       contains(github.ref, '-M'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Hand-written notes in release-notes/<version>.md (for example release-notes/1.0.0.md)
      # come first, then the commit list. A release with breaking commits (`type!:` or
      # `BREAKING CHANGE:`) must have a notes file; otherwise this step stops the release
      # before anything is published.
      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release-notes/${VERSION}.md"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"

          : > RELEASE_NOTES.md
          if [ -f "$NOTES_FILE" ]; then
            cat "$NOTES_FILE" >> RELEASE_NOTES.md
            printf '\n\n' >> RELEASE_NOTES.md
          elif [ -n "$PREVIOUS_TAG" ] \
            && grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<< "$(git log "${PREVIOUS_TAG}..HEAD" --format=%B)"; then
            echo "::error file=${NOTES_FILE}::This release has breaking changes but no ${NOTES_FILE}. Add the file with the upgrade notes, then tag a commit that contains it."
            exit 1
          fi

          echo "## What's Changed" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          if [ -n "$PREVIOUS_TAG" ]; then
            git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"* %s" >> RELEASE_NOTES.md
          else
            echo "* Initial release" >> RELEASE_NOTES.md
          fi

      - name: Publish to Maven Central (Central SonarType)
        run: ./gradlew publishAndReleaseToMavenCentral
        env:
          # GPG Signing credentials
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref, '-RC') || contains(github.ref, '-M') }}
